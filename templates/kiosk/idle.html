<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병원 서류 출력 키오스크</title>
    <style>
        /* 전체 화면 터치 대기화면 스타일 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }
        
        .idle-container {
            text-align: center;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .idle-container h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        
        .idle-container p {
            font-size: 2rem;
            margin: 1rem 0;
            opacity: 0.9;
        }
        
        .touch-icon {
            font-size: 6rem;
            margin: 2rem 0;
            animation: bounce 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        
        .version-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }
    </style>
</head>
<body id="idle-screen">
    <div class="idle-container">
        <h1>병원 서류 출력 키오스크</h1>
        <div class="touch-icon">👆</div>
        <p>화면을 터치해주세요</p>
        <p style="font-size: 1.5rem; opacity: 0.7;">Touch anywhere to start</p>
    </div>
    
    <div class="version-info">
        Phase 1.1 Backend
    </div>

    <script>
        // 전체 화면 터치 감지
        document.getElementById('idle-screen').addEventListener('click', function() {
            console.log('🖱️ 대기화면 터치됨 → 메인화면으로 이동');
            
            // 메인화면으로 이동
            window.location.href = '/kiosk/main/';
        });
        
        // 키보드 입력 감지 (접근성)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                window.location.href = '/kiosk/main/';
            }
        });
        
        // 화면 전환 효과
        document.body.addEventListener('click', function() {
            document.body.style.transition = 'opacity 0.3s ease';
            document.body.style.opacity = '0.7';
        });
    </script>
</body>
</html>

<!-- 
주석: 순수 대기화면
- 전체 화면이 터치 영역
- 터치 시 /kiosk/main/으로 이동
- WebSocket 연결 없음 (메인화면에서만)
- 시각적 효과로 사용자 유도
-->
