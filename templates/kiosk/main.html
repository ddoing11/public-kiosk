<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>병원 서류 출력 키오스크 - 메인</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .option-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .option-card:hover {
            border-color: #007bff;
            background: #e3f2fd;
        }
        
        .option-card h3 {
            margin-bottom: 20px;
            color: #495057;
        }
        
        .id-input-section input {
            width: 200px;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px;
        }
        
        .id-input-section button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        
        .id-input-section button:hover {
            background-color: #218838;
        }
        
        .consultation-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .consultation-section button {
            padding: 20px 40px;
            font-size: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        
        .consultation-section button:hover {
            background-color: #0056b3;
        }
        
        .mic-indicator {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #dc3545;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            color: white;
            font-size: 24px;
            transition: all 0.3s ease;
        }
        
        .mic-indicator.active {
            background-color: #28a745;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .status-bar {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 30px;
            text-align: center;
            font-weight: bold;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .gpt-response {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2196f3;
            display: none;
        }
        
        .gpt-response.show {
            display: block;
        }
    </style>
</head>
<body>
    <button class="back-button" onclick="window.location.href='/kiosk/idle/'">← 처음으로</button>
    
    <div class="container">
        <div class="header">
            <h1>🏥 병원 서류 출력 서비스</h1>
            <p>원하시는 방법을 선택해주세요</p>
        </div>
        
        <div class="options-container">
            <!-- 주민번호 입력 옵션 -->
            <div class="option-card id-input-section">
                <h3>📝 주민번호로 신원확인</h3>
                <p>주민번호 앞 6자리를 입력해주세요</p>
                <input type="text" 
                       id="resident-id" 
                       maxlength="6" 
                       placeholder="YYYYMM"
                       pattern="[0-9]{6}">
                <br>
                <button id="verify-button">확인</button>
            </div>
            
            <!-- 음성 상담 상태 표시 -->
            <div class="option-card consultation-section">
                <h3>🎤 음성 상담 서비스</h3>
                <p id="consultation-status">시스템 준비 중...</p>
                
                <div class="mic-indicator" id="mic-indicator">🎤</div>
                
                <p style="font-size: 16px; color: #28a745; margin-top: 10px;" id="instruction-text">
                    음성 안내를 들으신 후 말씀해주세요
                </p>
            </div>
        </div>
        
        <!-- GPT 응답 표시 영역 -->
        <div class="gpt-response" id="gpt-response">
            <h4>💬 상담원 응답:</h4>
            <div id="gpt-content"></div>
        </div>
        
        <!-- 상태 표시바 -->
        <div class="status-bar" id="status-bar">
            시스템 준비 완료 - 서비스를 선택해주세요
        </div>
    </div>

    <!-- WebSocket 클라이언트 로드 -->
    <script src="/static/js/voice_socket_main.js"></script>
    
    <script>
        // 전역 변수
        let isListening = false;
        let websocket = null;
        let currentRecognition = null;
        
        // 페이지 로드 시 자동으로 WebSocket 연결 및 음성 안내 시작
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('시스템 초기화 중...');
            updateConsultationStatus('WebSocket 연결 중...');
            initializeWebSocket();
            setupEventListeners();
        });
        
        // WebSocket 초기화
        function initializeWebSocket() {
            try {
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/ws/kiosk/`;
                
                websocket = new WebSocket(wsUrl);
                
                websocket.onopen = function(event) {
                    console.log('✅ WebSocket 연결됨');
                    updateStatus('✅ 음성 서비스 연결됨');
                    updateConsultationStatus('음성 안내 시작...');
                    // 연결되면 자동으로 안내 멘트가 서버에서 시작됨
                };
                
                websocket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleWebSocketMessage(data);
                };
                
                websocket.onclose = function(event) {
                    console.warn('⚠️ WebSocket 연결 종료:', event.code);
                    updateStatus('❌ 음성 서비스 연결 끊김');
                    updateConsultationStatus('연결이 끊어졌습니다. 페이지를 새로고침해주세요.');
                };
                
                websocket.onerror = function(error) {
                    console.error('❌ WebSocket 오류:', error);
                    updateStatus('❌ 음성 서비스 오류');
                    updateConsultationStatus('서비스 오류가 발생했습니다.');
                };
                
            } catch (error) {
                console.error('WebSocket 초기화 실패:', error);
                updateStatus('❌ 음성 서비스 초기화 실패');
            }
        }
        
        // WebSocket 메시지 처리
        function handleWebSocketMessage(data) {
            console.log('📥 WebSocket 메시지:', data);
            
            switch(data.type) {
                case 'tts.say':
                    // 브라우저 TTS 폴백 (Azure TTS 실패시에만 사용)
                    playBrowserTTS(data.text);
                    updateConsultationStatus('🔊 음성 안내 중...');
                    break;
                    
                case 'audio.ding':
                    playDingSound();
                    break;
                    
                case 'mic.on':
                    activateMicrophone();
                    updateConsultationStatus('🎤 음성 인식 중... 말씀해주세요');
                    break;
                    
                case 'mic.off':
                    deactivateMicrophone();
                    updateConsultationStatus('음성 처리 중...');
                    break;
                    
                case 'gpt.stream':
                    if (data.event === 'done') {
                        updateConsultationStatus('💬 상담원 응답 완료');
                        setTimeout(() => {
                            updateConsultationStatus('🎤 계속 말씀해주세요');
                        }, 2000);
                    } else if (data.delta) {
                        // 스트리밍 텍스트 추가
                        const contentDiv = document.getElementById('gpt-content');
                        contentDiv.textContent += data.delta;
                        document.getElementById('gpt-response').classList.add('show');
                    }
                    break;
                    
                case 'status':
                    updateStatus('📡 ' + data.state);
                    if (data.state === 'listening') {
                        updateConsultationStatus('🎤 음성 인식 중... 말씀해주세요');
                    }
                    break;
                    
                default:
                    console.warn('알 수 없는 메시지 타입:', data.type);
            }
        }
        
        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 주민번호 입력 확인 버튼
            document.getElementById('verify-button').addEventListener('click', verifyResidentId);
            
            // 주민번호 입력 필드 (숫자만 입력)
            document.getElementById('resident-id').addEventListener('input', function(e) {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });
            
            // Enter 키 처리
            document.getElementById('resident-id').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    verifyResidentId();
                }
            });
        }
        
        // 마이크 활성화
        function activateMicrophone() {
            console.log('🎤 마이크 활성화');
            isListening = true;
            document.getElementById('mic-indicator').classList.add('active');
            
            // 🔥 짧은 지연 후 음성 인식 시작 (TTS 완료 확실히 대기)
            setTimeout(() => {
                if (isListening) {
                    startSpeechRecognition();
                }
            }, 300);
        }
        
        // 마이크 비활성화
        function deactivateMicrophone() {
            console.log('🎤 마이크 비활성화');
            isListening = false;
            document.getElementById('mic-indicator').classList.remove('active');
            
            // 음성 인식 중지
            stopSpeechRecognition();
        }
        
        // 🔥 개선된 음성 인식 시작
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                console.warn('이 브라우저는 음성 인식을 지원하지 않습니다.');
                return;
            }
            
            // 기존 인식 중지
            if (currentRecognition) {
                currentRecognition.stop();
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            currentRecognition = new SpeechRecognition();
            
            currentRecognition.lang = 'ko-KR';
            currentRecognition.interimResults = false;
            currentRecognition.maxAlternatives = 1;
            currentRecognition.continuous = false;
            
            // 🔥 더 긴 침묵 허용 시간 설정 (브라우저마다 다름)
            // currentRecognition.speechTimeout = 3000;  // 일부 브라우저 지원
            
            currentRecognition.onstart = function() {
                console.log('🎙️ 음성 인식 시작됨');
            };
            
            currentRecognition.onresult = function(event) {
                const result = event.results[0][0].transcript.trim();
                console.log('🎤 인식된 텍스트:', result);
                
                // 🔥 너무 짧은 결과는 무시
                if (result.length < 2) {
                    console.log('너무 짧은 결과 무시:', result);
                    return;
                }
                
                // WebSocket으로 결과 전송
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.send(JSON.stringify({
                        type: 'stt.result',
                        text: result
                    }));
                }
            };
            
            currentRecognition.onerror = function(event) {
                console.error('❌ 음성 인식 오류:', event.error);
                
                // 🔥 no-speech 오류는 정상적인 상황으로 처리
                if (event.error === 'no-speech') {
                    console.log('음성이 감지되지 않음 - 대기 상태 유지');
                } else {
                    updateConsultationStatus('음성 인식 오류: ' + event.error);
                }
            };
            
            currentRecognition.onend = function() {
                console.log('🛑 음성 인식 종료됨');
                
                // 🔥 더 긴 지연 후 재시작 (무한 루프 방지)
                if (isListening) {
                    setTimeout(() => {
                        if (isListening) {
                            startSpeechRecognition();
                        }
                    }, 500);  // 500ms 지연
                }
            };
            
            try {
                currentRecognition.start();
            } catch (error) {
                console.error('음성 인식 시작 실패:', error);
            }
        }
        
        // 음성 인식 중지
        function stopSpeechRecognition() {
            console.log('🛑 음성 인식 중지');
            if (currentRecognition) {
                currentRecognition.stop();
                currentRecognition = null;
            }
        }
        
        // 브라우저 TTS (Azure TTS 폴백용)
        function playBrowserTTS(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.9;
                utterance.volume = 0.8;
                
                // 🔥 TTS 완료 후 처리
                utterance.onend = function() {
                    console.log('브라우저 TTS 완료');
                };
                
                speechSynthesis.speak(utterance);
            }
        }
        
        // 띵 효과음 재생
        function playDingSound() {
            console.log('🔔 띵 효과음 재생');
            const audio = new Audio('/static/audio/ding.wav');
            audio.play().catch(error => {
                console.error('효과음 재생 실패:', error);
            });
        }
        
        // 주민번호 검증
        function verifyResidentId() {
            const ridValue = document.getElementById('resident-id').value;
            
            if (ridValue.length !== 6) {
                updateStatus('⚠️ 주민번호 앞 6자리를 정확히 입력해주세요');
                return;
            }
            
            updateStatus('신원 확인 중...');
            
            // API 호출
            fetch('/kiosk/id-verify/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({value: ridValue})
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    updateStatus('✅ 신원 확인 완료 - 서비스 페이지로 이동합니다');
                    setTimeout(() => {
                        window.location.href = '/kiosk/services/';
                    }, 1500);
                } else {
                    updateStatus('❌ 신원 확인 실패: ' + (data.error || '다시 시도해주세요'));
                }
            })
            .catch(error => {
                console.error('API 오류:', error);
                updateStatus('❌ 네트워크 오류가 발생했습니다');
            });
        }
        
        // 상담 상태 업데이트
        function updateConsultationStatus(message) {
            document.getElementById('consultation-status').textContent = message;
            console.log('💬 상담 상태:', message);
        }
        
        // 상태 업데이트
        function updateStatus(message) {
            document.getElementById('status-bar').textContent = message;
            console.log('📊 상태:', message);
        }
    </script>
</body>
</html>
